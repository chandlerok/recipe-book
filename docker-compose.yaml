services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipe_book
      POSTGRES_USER: recipe_book
      POSTGRES_PASSWORD: recipe_book
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_book"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  flipt:
    image: docker.flipt.io/flipt/flipt:v2
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - flipt_data:/var/opt/flipt
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      PG_DSN: postgresql://recipe_book:recipe_book@postgres:5432/recipe_book
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  flipt_data:
