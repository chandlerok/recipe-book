name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: jdx/mise-action@v4
    - name: Build
      run: cargo build
      working-directory: recipe-scraper-server
    - name: Run tests
      run: cargo test -- --verbose
      working-directory: recipe-scraper-server
