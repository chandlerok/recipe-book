syntax = "proto3";

package recipe;

service RecipeService {
  rpc AddScrapeJob(AddScrapeJobRequest) returns (AddScrapeJobResponse);
  rpc SearchRecipes(SearchRecipesRequest) returns (SearchRecipesResponse);
  rpc GetRecipe(GetRecipeRequest) returns (GetRecipeResponse);
  rpc QueueStatus(QueueStatusRequest) returns (QueueStatusResponse);
}

message AddScrapeJobRequest {
  string url = 1;
  bool background = 2;
}

message AddScrapeJobResponse {
  string status = 1;
  GetRecipeResponse recipe = 2;
}

message SearchRecipesRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchRecipesResponse {
  repeated RecipeHit hits = 1;
}

message RecipeHit {
  GetRecipeResponse recipe = 1;
  double score = 2;
}

message GetRecipeRequest {
  string url = 1;
}

message GetRecipeResponse {
  string url = 1;
  string title = 2;
  int32 total_time = 3;
  repeated string ingredients = 4;
  repeated string instructions = 5;
  string image = 6;
}

message QueueStatusRequest {}

message QueueStatusResponse {
  int32 pending = 1;
  int32 in_progress = 2;
  int32 done = 3;
  int32 error = 4;
}
