[package]
name = "recipe-scraper-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
wreq = { version = "6.0.0-rc", features = ["gzip", "cookies"] }
wreq-util = { version = "3.0.0-rc", features = ["emulation"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
prost = "0.14.3"
rand = "0.8"
recipe-scraper = "0.1.1"
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
scraper = "0.23"
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
tonic-prost-build = "0.14.6"
